<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE 24 Batch</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html {
    scroll-behavior: smooth;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
}

body {
    background: #0b0b0f;
    color: white;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1a1a2e, #0b0b0f);
    text-align: center;
    position: relative;
}

.hero h1 {
    font-size: 60px;
}

.hero span {
    color: #6c63ff;
}

.hero p {
    margin-top: 20px;
    color: #aaa;
}

.hero button {
    margin-top: 30px;
    padding: 14px 28px;
    border-radius: 12px;
    border: none;
    background: #6c63ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.hero button:hover {
    transform: scale(1.05);
}

/* FB ICON TOP RIGHT */
.fb-icon {
    position: absolute;
    top: 25px;
    right: 25px;

    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    background: #111;
    border: 1px solid #333;

    color: #1877f2;
    text-decoration: none;
    font-size: 18px;
    transition: 0.3s;
}

.fb-icon:hover {
    background: #1877f2;
    color: white;
    transform: scale(1.1);
}


/* ALUMNI */
.alumni {
    padding: 80px 60px;
}

.alumni h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.search-bar {
    margin-bottom: 30px;
}

.search-bar input {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #111;
    color: white;
    width: 300px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: linear-gradient(145deg, #121212, #0d0d0d);
    border: 1px solid #222;
    padding: 20px;
    border-radius: 16px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: #6c63ff;
}

/* AVATAR */
.avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 15px;
    border: 2px solid #333;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TEXT */
.name {
    font-size: 18px;
    font-weight: 600;
}

.role {
    color: #aaa;
    font-size: 14px;
    margin: 8px 0;
}

.tag {
    background: #1a1a1a;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    border: 1px solid #333;
    display: inline-block;
    margin-bottom: 10px;
}

/* SOCIAL */
.socials {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

/* base style */
.socials a,
.socials button {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #111;
    border: 1px solid #333;
    color: #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
}

/* FIXED HOVER SYSTEM */
.socials a.fb:hover {
    background: #1877f2;
    color: white;
    transform: scale(1.1);
}

.socials a.linkedin:hover {
    background: #0077b5;
    color: white;
    transform: scale(1.1);
}

.socials button:hover {
    background: #28a745;
    color: white;
    transform: scale(1.1);
}
.typewriter {
    font-size: 64px;
    font-weight: 800;
    text-align: center;

    background: linear-gradient(90deg, #6c63ff, #00d4ff, #6c63ff);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;

    animation: gradientMove 4s linear infinite;

    position: relative;
    transition: 0.3s;
}

/* glowing effect */
.typewriter::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    width: 0%;
    height: 3px;
    background: #6c63ff;
    transition: 0.4s;
    transform: translateX(-50%);
}

/* hover magic */
.typewriter:hover {
    transform: scale(1.08);
    text-shadow: 0 0 20px rgba(108,99,255,0.8);
}

.typewriter:hover::after {
    width: 80%;
}

/* gradient animation */
@keyframes gradientMove {
    0% { background-position: 0% }
    100% { background-position: 200% }
}
/* MUSIC BUTTON */
.music-player {
    position: absolute;
    top: 25px;
    right: 80px; /* beside FB icon */

    width: 45px;
    height: 45px;
    border-radius: 50%;

    background: #111;
    border: 1px solid #333;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    transition: 0.3s;
}

.music-player:hover {
    transform: scale(1.1);
    border-color: #6c63ff;
}

/* SOUND BARS */
.bars {
    display: flex;
    gap: 3px;
}

.bars span {
    width: 4px;
    height: 12px;
    background: #6c63ff;
    border-radius: 2px;
    animation: none;
}

/* ANIMATION WHEN PLAYING */
.music-player.playing .bars span:nth-child(1) {
    animation: bounce 0.6s infinite;
}
.music-player.playing .bars span:nth-child(2) {
    animation: bounce 0.6s infinite 0.2s;
}
.music-player.playing .bars span:nth-child(3) {
    animation: bounce 0.6s infinite 0.4s;
}

@keyframes bounce {
    0%, 100% {
        height: 6px;
    }
    50% {
        height: 16px;
    }
}
/* LOGO TOP LEFT */
.logo {
    position: absolute;
    top: 20px;
    left: 20px;

    display: flex;
    align-items: center;
}

.logo img {
    height: 70px;   /* medium size (same visual balance as icons) */
    width: auto;
    object-fit: contain;
}
</style>
</head>

<script>
function copyPhone(number) {
    navigator.clipboard.writeText(number).then(() => {
        alert("Phone number copied: " + number);
    }).catch(() => {
        alert("Failed to copy");
    });
}
</script>

<body>

<!-- HERO -->
<section class="hero">
    <!-- LOGO -->
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

    <a href="https://www.facebook.com/YOUR_BATCH_PAGE" target="_blank" class="fb-icon">
        <i class="fab fa-facebook-f"></i>
    </a>
    <!-- MUSIC BUTTON -->
    <div class="music-player" onclick="toggleMusic()">
        <div class="bars">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bgMusic" loop>
        <source src="music/always_with_me_flute.mp3" type="audio/mpeg">
    </audio>

    <h1 class="typewriter"></h1>
    <br>
    <h4>Military Institute of Science and Technology</h4>
    <h4>Department of CSE, Batch CSE 24</h4>

    <a href="#alumni">
        <button>Explore the Batch ↓</button>
    </a>

</section>

<!-- ALUMNI -->
<section id="alumni" class="alumni">

    <h2>Batch Directory</h2>
    <p class="subtitle">Meet the members of CSE 24.</p>

    <div class="search-bar">
        <input type="text" placeholder="Search by name...">
    </div>

    <div class="grid">
    </div>
    
</section>

<script>
const searchInput = document.querySelector(".search-bar input");
const cards = document.querySelectorAll(".card");

searchInput.addEventListener("input", function () {
    const value = this.value.toLowerCase();

    cards.forEach(card => {
        const name = card.querySelector(".name").textContent.toLowerCase();
        card.style.display = name.includes(value) ? "block" : "none";
    });
});
</script>
<script>
const text = "Welcome to CSE 24";
const el = document.querySelector(".typewriter");

let index = 0;

function typeEffect() {
    if (index < text.length) {
        el.innerHTML = text.substring(0, index + 1);
        index++;
        setTimeout(typeEffect, 80);
    }
}

typeEffect();
</script>
<script>
const music = document.getElementById("bgMusic");
const player = document.querySelector(".music-player");

let isPlaying = false;

function toggleMusic() {
    if (!isPlaying) {
        music.muted = false;
        music.play();
        player.classList.add("playing");
    } else {
        music.pause();
        player.classList.remove("playing");
    }
    isPlaying = !isPlaying;
}
</script>

</body>
</html>
